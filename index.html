<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b19"><meta name="apple-mobile-web-app-capable" content="yes"><title>REOSTO LEVELING</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#20204c,#080b19 60%);color:#edf0ff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;min-height:100vh}main{max-width:520px;margin:auto;padding:26px 18px 90px}.eyebrow{letter-spacing:3px;color:#b1a5ff;font-size:11px}h1{font-size:27px;margin:8px 0 25px;letter-spacing:2px}.panel{border:1px solid #514c86;background:linear-gradient(145deg,#1b1c3b,#111528);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 0 24px #6e4ff015}.rank{color:#d4b4ff;font-size:12px}.level{font-size:40px;font-weight:800;margin:10px 0}.bar{height:10px;border-radius:10px;background:#343553;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7147ff,#ce7aff);transition:width .3s}.muted{color:#a9aacb;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#20213f;padding:14px;border-radius:12px}.stat b{display:block;font-size:23px;margin-top:5px}.quest{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid #353552}.quest:last-child{border:0}.quest small{display:block;color:#b6addb;margin-top:4px}.quest button,.primary{background:#7652ed;color:white;border:0;border-radius:9px;padding:10px 13px;font-weight:700}.quest button:disabled{background:#39394d;color:#aaa}.primary{width:100%;padding:14px;margin-top:10px}.notice{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#5c3fd1;border:1px solid #bb9cff;padding:15px;border-radius:12px;box-shadow:0 0 40px #8861ff80;display:none;z-index:3;text-align:center;width:max-content;max-width:90vw}input{background:#12152b;border:1px solid #5a5488;border-radius:8px;color:white;padding:12px;width:100%;font-size:16px}footer{text-align:center;color:#8585ad;font-size:11px;margin-top:30px}</style></head><body><div id="notice" class="notice"></div><main><div class="eyebrow">SYSTEM // PLAYER AWAKENED</div><h1>REOSTO <span style="color:#ad8bff">LEVELING</span></h1><section class="panel"><div class="rank" id="rank"></div><div class="level" id="level"></div><div class="muted" id="title"></div><p class="muted" id="xptext"></p><div class="bar"><div class="fill" id="xpbar"></div></div></section><section class="panel"><div class="eyebrow">STATUS</div><div class="stats" style="margin-top:15px" id="stats"></div></section><section class="panel"><div class="eyebrow">DAILY QUEST</div><p class="muted" id="today"></p><div id="quests"></div></section><section class="panel"><div class="eyebrow">CUSTOM QUEST</div><p class="muted">自分だけのクエストを追加（達成で20 EXP）</p><input id="custom" maxlength="40" placeholder="例：読書を15分する"><button class="primary" id="add">クエストを追加</button></section><section class="panel"><div class="eyebrow">ACHIEVEMENTS</div><p id="achievements" class="muted"></p></section><footer>YOUR REAL LIFE IS YOUR ADVENTURE.</footer></main><script>
const key='reosto-leveling-v1';const defaults=[{id:'study',name:'勉強を20分する',stat:'知力',xp:25},{id:'exercise',name:'無理のない運動をする',stat:'体力',xp:25},{id:'code',name:'プログラミングを15分学ぶ',stat:'知力',xp:25},{id:'rest',name:'休憩して心身を整える',stat:'精神力',xp:20},{id:'habit',name:'今日の目標を一つ達成する',stat:'継続力',xp:25}];
let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}if(!state||typeof state!=='object')state={xp:0,stats:{知力:10,体力:10,精神力:10,継続力:10},completed:{},custom:[],total:0};state.stats ||= {知力:10,体力:10,精神力:10,継続力:10};state.completed ||= {};state.custom ||= [];state.total ||= 0;state.xp ||= 0;
const day=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const save=()=>localStorage.setItem(key,JSON.stringify(state));const level=()=>Math.floor(Math.sqrt(state.xp/50))+1;const threshold=l=>50*(l-1)*(l-1);function flash(msg){let n=document.getElementById('notice');n.textContent=msg;n.style.display='block';setTimeout(()=>n.style.display='none',2300)}function render(){let lv=level(),start=threshold(lv),end=threshold(lv+1),r=lv>=50?'S':lv>=35?'A':lv>=25?'B':lv>=15?'C':lv>=7?'D':'E';document.getElementById('rank').textContent=`${r} RANK • PLAYER`;document.getElementById('level').textContent=`LEVEL ${lv}`;document.getElementById('title').textContent=lv>=25?'称号：覚醒した挑戦者':lv>=10?'称号：成長する冒険者':'称号：駆け出しの挑戦者';document.getElementById('xptext').textContent=`EXP ${state.xp-start} / ${end-start}  ·  TOTAL ${state.xp}`;document.getElementById('xpbar').style.width=`${100*(state.xp-start)/(end-start)}%`;document.getElementById('stats').innerHTML=Object.entries(state.stats).map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join('');document.getElementById('today').textContent=`${day()} — 毎日0時にクエスト更新`;const q=document.getElementById('quests');q.replaceChildren();for(const item of [...defaults,...state.custom]){let row=document.createElement('div');row.className='quest';let info=document.createElement('div');let strong=document.createElement('strong');strong.textContent=item.name;let small=document.createElement('small');small.textContent=`+${item.xp} EXP / ${item.stat} +1`;info.append(strong,small);let b=document.createElement('button');let done=state.completed[day()]?.includes(item.id);b.textContent=done?'達成済':'達成';b.disabled=!!done;b.onclick=()=>complete(item);row.append(info,b);q.append(row)}document.getElementById('achievements').textContent=[state.total>=1?'🏅 初めての一歩':'🔒 初めての一歩（クエスト1回）',state.total>=10?'🏅 継続の証':'🔒 継続の証（累計10回）',state.total>=50?'🏆 努力の達人':'🔒 努力の達人（累計50回）'].join('　 /　 ')}function complete(item){let d=day();state.completed[d] ||= [];if(state.completed[d].includes(item.id))return;let before=level();state.completed[d].push(item.id);state.xp+=item.xp;state.stats[item.stat]=(state.stats[item.stat]||10)+1;state.total++;save();render();flash(level()>before?`LEVEL UP! ${before} → ${level()} 🎉`:`QUEST CLEAR! +${item.xp} EXP`)}document.getElementById('add').onclick=()=>{let inp=document.getElementById('custom');let name=inp.value.trim();if(!name)return;state.custom.push({id:'custom-'+Date.now(),name,stat:'継続力',xp:20});inp.value='';save();render();flash('新しいクエストを追加！')};render();
</script></body></html>
